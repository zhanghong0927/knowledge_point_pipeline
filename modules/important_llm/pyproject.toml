[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "book-extractor"
version = "0.1.0"
description = "Source-preserving, per-book Markdown knowledge extraction"
requires-python = ">=3.12"
dependencies = [
  "markdown-it-py==4.2.0",
  "chonkie==1.7.0",
  "transformers==5.14.1",
  "instructor==1.17.0",
  "openai==2.54.0",
  "pydantic==2.13.5",
  "tenacity==9.1.4",
]

[project.scripts]
book-extract = "book_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["ruff==0.16.8"]

# 已确认的格式化配置；历史实验和冻结产物不参与批量改写。
[tool.ruff]
target-version = "py312"
line-length = 88
indent-width = 4
extend-exclude = [".venv", "outputs", "data", "experiments", "schemas"]

[tool.ruff.lint]
# 基础错误、导入排序、行长与单行复合语句检查；不强制空洞的docstring模板。
select = ["E4", "E7", "E9", "F", "I", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true
