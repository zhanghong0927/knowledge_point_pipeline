name: Offline tests

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -B validate_offline.py --suite integration
      - run: python -B validate_offline.py --suite cleaning
      - run: python -B -m unittest discover -s modules/dictionary/tests -p test_portable_pipeline.py -v
        env:
          PYTHONPATH: modules/dictionary
